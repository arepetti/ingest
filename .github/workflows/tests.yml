name: Tests

# Run the full test suite (unit + integration) whenever master changes or a PR targets it.
# The integration tests start a throwaway MongoDB via Testcontainers; the GitHub-hosted Ubuntu
# runners ship with Docker, so no extra service configuration is needed.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Test only the two test projects (and their dependencies). This deliberately avoids building
      # Ingest.AppHost and the SPA: the admin SPA is only built on `dotnet publish` of Ingest.Api,
      # so no Node toolchain is required here.
      - name: Restore
        run: |
          dotnet restore tests/Ingest.Tests/Ingest.Tests.csproj
          dotnet restore tests/Ingest.IntegrationTests/Ingest.IntegrationTests.csproj

      - name: Unit tests
        run: dotnet test tests/Ingest.Tests/Ingest.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=unit.trx" --results-directory TestResults

      - name: Integration tests
        run: dotnet test tests/Ingest.IntegrationTests/Ingest.IntegrationTests.csproj -c Release --no-restore --logger "trx;LogFileName=integration.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
